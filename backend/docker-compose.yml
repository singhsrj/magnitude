# Runs the rating service against Neon (Postgres) and Upstash (Redis), configured in backend/.env.
# (The problem service in services/problem is no longer part of the stack: since Phase 4 the browser generates
# problems from a server-issued seed and the rating service replays them with the shared engine.)
#   docker compose up --build
# Fully offline instead (local Postgres + Redis containers):
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
name: magnitude

services:
  # One-shot: applies Alembic migrations, then exits. Uses DIRECT_DATABASE_URL (unpooled).
  migrate:
    build:
      context: .
      dockerfile: services/rating/Dockerfile
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    restart: "no"

  rating:
    build:
      context: .
      dockerfile: services/rating/Dockerfile
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
